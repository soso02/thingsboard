name: CI - ThingsBoard

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (skip tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Build "install" en local Maven (dans le runner), SANS tests
      - name: Maven install (skip tests + skip license)
        run: |
          mvn -B -Dlicense.skip=true -DskipTests -DskipITs clean install

  unit-tests:
    name: Unit tests (allowed to fail)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Lance les tests unitaires même si certains échouent
      - name: Run unit tests
        env:
          TZ: UTC
        run: |
          mvn -B -Dlicense.skip=true -DskipITs test \
            -Duser.timezone=UTC -Duser.language=en -Duser.country=US

  run-thingsboard:
    name: Run ThingsBoard (Docker smoke test)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Launch ThingsBoard (Docker)
        run: |
          docker pull thingsboard/tb-postgres:latest
          docker run -d --name tb -p 8080:9090 thingsboard/tb-postgres:latest

          echo "Waiting for ThingsBoard on http://localhost:8080 ..."
          for i in {1..60}; do
            if curl -fsS http://localhost:8080 >/dev/null; then
              echo "ThingsBoard is UP!"
              exit 0
            fi
            sleep 5
          done

          echo "ThingsBoard did not start in time. Logs:"
          docker logs tb --tail 200
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f tb || true
