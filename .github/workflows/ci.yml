name: CI - Common data & util unit tests

on:
  push:
    branches: [ "master", "ci" ]

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Generate proto sources
        run: |
          chmod +x build_proto.sh
          ./build_proto.sh

      # Build seulement ce qui est nécessaire pour common/data + common/util
      - name: Build deps
        run: |
          mvn -B -Dlicense.skip=true -DskipTests \
            -pl common/data,common/util -am \
            install

      # Run uniquement les tests unitaires de common/data et common/util
      - name: Run unit tests (common/data + common/util)
        run: |
          mvn -B test \
            -pl common/data,common/util -am \
            -fae \
            -DskipIntegrationTests=true \
            -Dlicense.skip=true \
            -DforkCount=2C \
            -DreuseForks=true
    
      - name: Launch ThingsBoard (Docker)
        run: |
          docker pull thingsboard/tb-postgres:latest
          docker run -d --name tb -p 8080:9090 thingsboard/tb-postgres:latest

          echo "Waiting for ThingsBoard on http://localhost:8080 ..."
          for i in {1..60}; do
            if curl -fsS http://localhost:8080 >/dev/null; then
              echo "ThingsBoard is UP!"
              exit 0
            fi
            sleep 5
          done

          echo "ThingsBoard did not start in time. Logs:"
          docker logs tb --tail 200
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f tb || true
      
        