name: CI - ThingsBoard

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build-test-run:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Moscow
      MAVEN_OPTS: >-
        -Duser.timezone=Europe/Moscow
        -Duser.language=ru
        -Duser.country=RU
        -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 1) BUILD seulement (compile + package), sans tests
      - name: Build (skip tests)
        run: mvn -B -Dlicense.skip=true -DskipTests install

      # 2) TESTS unitaires (séparés)
      #    -> on les exécute tous, mais on n'échoue pas le job si ça fail
      - name: Unit tests (allow failures)
        continue-on-error: true
        env:
          TZ: UTC
        run: mvn -B -Dlicense.skip=true test

      # 3) Lancement ThingsBoard (Docker)
      - name: Launch ThingsBoard (Docker)
        run: |
          docker pull thingsboard/tb-postgres:latest
          docker run -d --name tb -p 8080:9090 thingsboard/tb-postgres:latest

          echo "Waiting for ThingsBoard on http://localhost:8080 ..."
          for i in {1..60}; do
            if curl -fsS http://localhost:8080 >/dev/null; then
              echo "ThingsBoard is UP!"
              exit 0
            fi
            sleep 5
          done

          echo "ThingsBoard did not start in time. Logs:"
          docker logs tb --tail 200
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f tb || true